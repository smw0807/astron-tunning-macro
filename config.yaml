# 아스트론 아이템 개조 매크로 설정
# 좌표는 모두 캡처 해상도(screencap, 960x540) 기준 픽셀값.
# GUI(python -m src.gui)로 편집 권장.

adb:
  path: "C:/Program Files/BlueStacks_nxt/HD-Adb.exe"
  # serial 지정 시 그대로 사용, 비우면 instance_name 으로 bluestacks.conf 에서 포트 탐색
  serial: "127.0.0.1:64384"
  instance_name: "개조"
  bluestacks_conf: "C:/ProgramData/BlueStacks_nxt/bluestacks.conf"
  package: "com.ctugames.astron"

ocr:
  rec_model_path: "models/korean_rec.onnx"
  rec_keys_path: "models/korean_dict.txt"
  rec_img_shape: [3, 32, 320]

timing:
  after_tap: 0.6
  after_modify: 1.8      # 개조 버튼 누른 뒤 결과 뜰 때까지
  after_confirm: 1.2
  loop_idle: 0.4

safety:
  max_attempts: 300         # 총 개조 시도 이 횟수 넘으면 중단
  min_gold: 100000          # 골드가 이보다 적으면 중단 (0 = 검사 안 함)
  gold_region: [515, 478, 645, 500]
  stop_on_unknown_screen: true   # 성공/실패 문구를 못 읽으면 중단

# 개조 루프 규칙
modify:
  fail_limit: 3             # 연속 실패가 이 횟수에 도달하면 recovery_sequence 실행 후 카운터 초기화
  # 중단 목표 (둘 중 하나라도 만족하면 중단). 개조 성공 1회 = 아이템 레벨 +1.
  target_level: 8           # 이 레벨 도달 시 중단 (1~8, 0 = 레벨 기준 미사용)
  target_successes: 0       # 누적 성공 N회면 중단 (0 = 미사용)
  start_level: 1            # 레벨 OCR 실패 시 성공 횟수로 레벨 추정하는 기준
  level_region: [0, 0, 0, 0]   # 개조 화면의 아이템 레벨(Lv.N) 표시 영역. GUI로 지정.
  level_pattern: '(?:lv|레벨)\s*[.:]?\s*([1-8])'   # 레벨 추출 정규식 (그룹1 = 숫자)
  # 연속 실패 한계 도달 / 개조 불가 감지 시 복구 동작 (수리 / 재구매 등). GUI로 채우기.
  recovery_sequence: []

# 개조 1회 시도 시퀀스. 매번 처음부터 실행되므로 아이템 재선택까지 포함해 멱등하게 구성.
# step 종류:
#   {tap: [x,y]} / {swipe: [x1,y1,x2,y2,ms]} / {wait: sec} / {key: code}
#   {tap_if_text: {text: "확인", region: [x1,y1,x2,y2]}}   영역에 텍스트 있으면 그 위치 탭
attempt_sequence:
  - {tap: [202, 128]}       # '개조' 탭
  - {wait: 0.8}
  # TODO(GUI): 개조할 아이템 클릭
  - {tap: [0, 0]}           # TODO(GUI): '개조' 실행 버튼
  - {wait: 1.0}
  - {tap_if_text: {text: "예", region: [380, 260, 580, 320]}}   # 확인 팝업

# 결과 판정: after_modify 대기 후 region 을 OCR, 키워드 매칭
result:
  region: [300, 230, 660, 320]
  success_keywords: ["개조에 성공", "성공하였", "성공했습니다"]
  fail_keywords: ["개조에 실패", "실패하였", "실패했습니다"]
  # 개조 불가/막힘 상태를 알리는 문구 (있으면). 감지 시 recovery_sequence 실행.
  locked_keywords: ["개조할 수 없", "더 이상 개조", "개조가 불가"]
  # 성공 팝업 닫기
  success_sequence:
    - {tap_if_text: {text: "확인", region: [380, 300, 580, 360]}}
    - {wait: 0.6}
  # 실패 팝업 닫기
  fail_sequence:
    - {tap_if_text: {text: "확인", region: [380, 300, 580, 360]}}
    - {wait: 0.6}
