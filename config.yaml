# 아스트론 아이템 개조 매크로 설정
# 좌표는 모두 캡처 해상도(screencap) 기준 픽셀값. GUI(python -m src.gui)로 편집 권장.
# 이 파일은 GUI 저장 시 재생성되므로 주석은 유지되지 않습니다.

adb:
  path: C:/Program Files/BlueStacks_nxt/HD-Adb.exe
  serial: 127.0.0.1:64384
  instance_name: 개조
  bluestacks_conf: C:/ProgramData/BlueStacks_nxt/bluestacks.conf
  package: com.ctugames.astron
ocr:
  rec_model_path: models/korean_rec.onnx
  rec_keys_path: models/korean_dict.txt
  rec_img_shape:
  - 3
  - 32
  - 320
timing:
  after_tap: 0.6
  after_modify: 2.2
  after_confirm: 1.2
  loop_idle: 0.4
safety:
  max_attempts: 500
  min_gold: 100000
  gold_region:
  - 515
  - 478
  - 645
  - 500
  stop_on_unknown_screen: true
slots:
  target_count: 8
  positions:
  - - 817
    - 384
  - - 906
    - 381
  - - 817
    - 424
  - - 898
    - 425
  - - 814
    - 476
  - - 902
    - 468
  - - 810
    - 518
  - - 909
    - 520
modify:
  fail_limit: 3
  target_level: 8
  start_level: 1
  level_region:
  - 0
  - 0
  - 0
  - 0
  level_pattern: (?:lv|레벨)\s*[.:]?\s*([1-8])
buy_sequence:
- tap:
  - 49
  - 126
- wait: 0.5
- tap:
  - 57
  - 357
- wait: 0.4
- wait_text:
    text: 취소
    timeout: 3.0
    region:
    - 330
    - 210
    - 630
    - 360
- tap:
  - 476
  - 240
- wait: 0.6
buy_fail_keywords:
- 골드가 부족
- 골드가부족
- 가방이 가득
- 인벤토리가 가득
sell_sequence:
- tap:
  - 129
  - 125
- wait: 0.5
- tap_slot: true
- wait: 0.4
- wait_text:
    text: 취소
    timeout: 3.0
    region:
    - 330
    - 210
    - 630
    - 360
- tap:
  - 472
  - 238
- wait: 0.5
- wait_text:
    text: 정말로 판매
    timeout: 3.0
    required: true
    region:
    - 330
    - 220
    - 630
    - 270
- tap:
  - 440
  - 307
- wait: 0.8
attempt_sequence:
- tap:
  - 202
  - 128
- wait: 0.8
- tap_slot: true
- wait: 0.5
- wait_text:
    text: 대박개조
    timeout: 3.0
    required: true
    region:
    - 300
    - 330
    - 660
    - 450
- tap:
  - 377
  - 357
- wait: 1.0
- tap_if_text:
    text: 예
    region:
    - 380
    - 260
    - 580
    - 320
result:
  region:
  - 144
  - 2
  - 406
  - 102
  success_keywords:
  - 축하해요.
  - 축하
  fail_keywords:
  - 미안해요.
  - 미안
  locked_keywords:
  - 개조할 수 없
  - 더 이상 개조
  - 개조가 불가
  success_sequence:
  - tap_if_text:
      text: 확인
      region:
      - 380
      - 300
      - 580
      - 360
  - wait: 0.6
  fail_sequence:
